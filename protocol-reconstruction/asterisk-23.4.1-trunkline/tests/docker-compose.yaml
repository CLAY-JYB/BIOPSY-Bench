services:
  main:
    # Network posture is declared ONCE, in task.toml -- the compose side
    # deliberately carries no network_mode (a stale value here would fight
    # the task manifest). The local score gate still runs the verifier with
    # --network host as a deliberately wider superset (the oracle listens on
    # a host port at gate time); production runs follow the manifest.
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE