schema_version = "1.2"

[task]
name = "security/mariadb-12.3.3-binlatch"
description = "Reverse the undocumented wire protocol hidden inside a stripped mariadb-12.3.3 binary and prove the reconstruction by interoperating with it."
authors = [{ name = "research-team", email = "" }]
keywords =  ["protocol, reverse-engineering, wire-format, interoperability, binlatch"]

[metadata]
difficulty = "expert"  # easy | medium | hard | expert
category = "security"
tags = ["security, protocol-reconstruction, expert"]

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 1
memory_mb = 1024
storage_mb = 1024
gpus = 0
network_mode = "no-network"
os = "linux"

[agent]
timeout_sec = 7200.0

[solution]

[environment]
# 30-min budget: warm-cache builds finish in seconds; fresh-machine cold builds run 15-30+ min (construction-time builds via the pipeline are unbounded)
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 4096
storage_mb = 2048
gpus = 0
network_mode = "no-network"
os = "linux"

[verifier.env]

[solution.env]

[environment.env]
