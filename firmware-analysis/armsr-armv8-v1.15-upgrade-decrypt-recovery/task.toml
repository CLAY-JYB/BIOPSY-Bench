schema_version = "1.2"

[task]
name = "security/armsr-armv8-v1.15-upgrade-decrypt-recovery"
description = "Analyze an opaque arm64 virtual (hub/camera class) firmware image (I7F2X3-V1M1): identify the encapsulation, unpack it, recover the filesystem, inventory the components, and characterize the embedded software with emulation-proven findings."
authors = [{ name = "research-team", email = "" }]
keywords =  ["firmware", "reverse-engineering", "binwalk", "squashfs", "qemu", "embedded"]

[metadata]
difficulty = "expert"  # easy | medium | hard | expert
category = "security"
tags = ["firmware-analysis", "iot", "i7f2x3-v1m1"]

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 1
memory_mb = 1024
storage_mb = 1024
gpus = 0
network_mode = "no-network"
os = "linux"

[agent]
timeout_sec = 7200.0

[solution]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 4096
