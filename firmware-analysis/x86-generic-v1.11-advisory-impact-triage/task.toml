schema_version = "1.2"

[task]
name = "security/x86-generic-v1.11-advisory-impact-triage"
description = "Analyze an opaque 32-bit x86 legacy/embedded firmware image (I8F2X6-O3P1D3T0-V1M1). Identify the encapsulation, unpack it, recover the filesystem, inventory the components, and characterize the embedded software with emulation-proven findings."
authors = [{ name = "research-team", email = "" }]
keywords =  ["firmware", "reverse-engineering", "binwalk", "squashfs", "qemu", "embedded"]

[metadata]
difficulty = "hard"  # easy | medium | hard | expert
category = "security"
tags = ["firmware-analysis", "iot", "i8f2x6-o3p1d3t0-v1m1"]

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 1
memory_mb = 1024
storage_mb = 1024
gpus = 0
network_mode = "no-network"
os = "linux"

[agent]
timeout_sec = 7200.0

[solution]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 4096
storage_mb = 2048
gpus = 0
network_mode = "no-network"
os = "linux"

[verifier.env]

[solution.env]

