schema_version = "1.2"

[task]
name = "security/tplink-archer-a6-v3-v1.0.16-capability-sweep"
description = "Analyze an opaque soho router (classic) firmware image (I8F2X1-O0P1D0T0-V1M2): identify the encapsulation, unpack it, recover the filesystem, inventory the components, and characterize the embedded software with emulation-proven findings."
authors = [{ name = "research-team", email = "" }]
keywords =  ["firmware", "reverse-engineering", "binwalk", "squashfs", "qemu", "embedded"]

[metadata]
difficulty = "hard"  # easy | medium | hard | expert
category = "security"
tags = ["firmware-analysis", "iot", "i8f2x1-o0p1d0t0-v1m2"]

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 1
memory_mb = 1024
