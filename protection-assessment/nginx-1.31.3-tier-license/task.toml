schema_version = "1.2"

[task]
name = "security/nginx-1.31.3-tier-license"
description = "Reverse engineer a multi-layer protected web-server build. Defeat the protections, recover the license verification logic end-to-end, and forge a key that unlocks the upstream load-balancing tier."
authors = [{ name = "research-team", email = "" }]
keywords =  ["reverse-engineering", "license-verification"]

[metadata]
difficulty = "hard"  # easy | medium | hard | expert
category = "security"
tags = ["protection-assessment", "binary-analysis", "web-server"]

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 1
memory_mb = 1024
storage_mb = 1024
gpus = 0
network_mode = "no-network"
os = "linux"

[agent]
timeout_sec = 7200.0

[solution]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 4096
storage_mb = 2048
gpus = 0
network_mode = "no-network"
os = "linux"

[verifier.env]

[solution.env]

[environment.env]
