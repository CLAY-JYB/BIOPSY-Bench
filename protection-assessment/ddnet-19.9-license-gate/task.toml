schema_version = "1.2"

[task]
name = "security/ddnet-19.9-license-gate"
description = "Reverse engineer a protected DDNet binary to find and defeat the license key verification system. Extract the verification logic and derive a valid license key."
authors = [{ name = "research-team", email = "" }]
keywords =  ["reverse-engineering", "binary-analysis", "license-verification", "software-protection"]

[metadata]
difficulty = "hard"  # easy | medium | hard | expert
category = "security"
tags = ["security", "reverse-engineering"]

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 1
memory_mb = 1024
storage_mb = 1024
gpus = 0
network_mode = "no-network"
os = "linux"

[agent]
timeout_sec = 7200.0

[solution]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 4096
storage_mb = 2048
gpus = 0
network_mode = "no-network"
os = "linux"

[verifier.env]

[solution.env]

[environment.env]
