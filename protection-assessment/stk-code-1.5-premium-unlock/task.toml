schema_version = "1.2"

[task]
name = "security/stk-code-1.5-premium-unlock"
description = "Reverse engineer a protected SuperTuxKart binary whose premium content (story mode, challenges, karts and tracks) is gated by a license entitlement system. Defeat the protection layers, recover the verification logic end-to-end, and derive a valid license key."
authors = [{ name = "research-team", email = "" }]
keywords =  ["reverse-engineering", "binary-analysis", "license-verification", "software-protection"]

[metadata]
difficulty = "expert"  # easy | medium | hard | expert
category = "security"
tags = ["security", "reverse-engineering"]

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 1
memory_mb = 1024
storage_mb = 1024
gpus = 0
network_mode = "no-network"
os = "linux"

[agent]
timeout_sec = 7200.0

[solution]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 4096
storage_mb = 2048
gpus = 0
network_mode = "no-network"
os = "linux"

[verifier.env]

[solution.env]

[environment.env]
