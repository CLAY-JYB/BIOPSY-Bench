schema_version = "1.2"

[task]
name = "security/ffmpeg-9.0.1-transcode-unlock"
description = "Reverse-engineer a license-protected multimedia transcoding tool. Defeat its protection layers and key verification to recover a valid license key that unlocks the transcoding engine."
authors = [{ name = "research-team", email = "" }]
keywords =  ["reverse-engineering", "software-protection", "ffmpeg", "license-verification"]

[metadata]
difficulty = "hard"  # easy | medium | hard | expert
category = "security"
tags = ["reverse-engineering", "software-protection", "license-verification", "multimedia"]

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 1
memory_mb = 1024
storage_mb = 1024
gpus = 0
network_mode = "no-network"
os = "linux"

[agent]
timeout_sec = 7200.0

[solution]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 4096
storage_mb = 2048
gpus = 0
network_mode = "no-network"
os = "linux"

[verifier.env]

[solution.env]

[environment.env]
